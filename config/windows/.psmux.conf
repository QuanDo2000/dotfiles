# Windows-native equivalents of the shared Home Manager tmux defaults.
set -g default-terminal xterm-256color
set -g mode-keys vi
set -g mouse on
set -g focus-events on
set -g aggressive-resize on
set -s escape-time 10
set -g history-limit 50000

# Claude and clipboard integration. ConPTY handles true color and extended keys
# directly, so the Unix terminal-features and extended-keys options are omitted.
set -g allow-passthrough on
set -g set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-selection-and-cancel \; paste-buffer -p

set -g display-time 4000
set -g status-interval 5
bind C-p previous-window
bind C-n next-window
bind b last-window
bind R source-file ~/.psmux.conf \; display-message "Sourced psmux.conf!"

# Pane navigation.
bind h select-pane -L
bind C-h select-pane -L
bind j select-pane -D
bind C-j select-pane -D
bind k select-pane -U
bind C-k select-pane -U
bind l select-pane -R
bind C-l select-pane -R

# Window reordering.
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Pane resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits and new windows open in the current path. psmux accepts but ignores
# tmux's -f split flag, so the backslash and underscore bindings use normal splits.
bind "|" split-window -h -c "#{pane_current_path}"
bind "\\" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"
bind "_" split-window -v -c "#{pane_current_path}"
bind "%" split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Catppuccin Macchiato. menu-selected-style and popup-style are omitted because
# psmux 3.3.8 does not implement them.
set -g status-style "default"
set -g mode-style "bg=#363a4f,bold"
set -g message-style "fg=#8bd5ca,bg=default,align=centre"
set -g message-command-style "fg=#8bd5ca,bg=default,align=centre"
set -g popup-border-style "fg=#494d64"
set -g pane-border-style "fg=#6e738d"
set -g pane-active-border-style "#{?pane_in_mode,fg=#b7bdf8,#{?pane_synchronized,fg=#c6a0f6,fg=#b7bdf8}}"
set -g clock-mode-colour "#8aadf4"
set -g window-status-activity-style "bg=#b7bdf8,fg=#181926"
set -g window-status-bell-style "bg=#eed49f,fg=#181926"
set -g window-status-separator " "
set -g window-status-format "#[fg=#181926,bg=#939ab7] #I #[fg=#cad3f5,bg=#363a4f] #{b:pane_current_command} "
set -g window-status-current-format "#[fg=#181926,bg=#c6a0f6] #I #[fg=#cad3f5,bg=#494d64] #{b:pane_current_command} "

set -g status-right-length 100
set -g status-left ''
set -g status-right '#[fg=#f4dbd6]#[fg=#181926,bg=#f4dbd6] #[fg=#cad3f5,bg=#363a4f] #{b:pane_current_path}#[fg=#363a4f] #[fg=#91d7e3]#[fg=#181926,bg=#91d7e3] #[fg=#cad3f5,bg=#363a4f] #{username}#[fg=#363a4f] #[fg=#c6a0f6]#[fg=#181926,bg=#c6a0f6]󰒋 #[fg=#cad3f5,bg=#363a4f] #H#[fg=#363a4f] #[fg=#7dc4e4]#[fg=#181926,bg=#7dc4e4]󰃰 #[fg=#cad3f5,bg=#363a4f] %Y-%m-%d %H:%M:%S#[fg=#363a4f] '
