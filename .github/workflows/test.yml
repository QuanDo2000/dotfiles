name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bash-macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Run macOS checks in parallel
        shell: bash
        run: |
          nix develop .#ci -c bash -c '
            bash ./tests/bash/runner.sh test_neovim.sh &
            neovim_pid=$!
            bash ./tests/bash/runner.sh test_cli.sh test_doctor.sh test_mac_install.sh test_tmux.sh &
            core_pid=$!

            status=0
            wait "$neovim_pid" || { echo "::error::macOS Neovim tests failed"; status=1; }
            wait "$core_pid" || { echo "::error::macOS core tests failed"; status=1; }
            exit "$status"
          ' &
          tests_pid=$!
          nix eval --raw .#darwinConfigurations.mac.system.drvPath &
          darwin_pid=$!
          nix build .#codex .#codebase-memory-mcp .#pi-extensions --no-link &
          packages_pid=$!

          status=0
          wait "$tests_pid" || { echo "::error::macOS portability tests failed"; status=1; }
          wait "$darwin_pid" || { echo "::error::nix-darwin evaluation failed"; status=1; }
          wait "$packages_pid" || { echo "::error::macOS package builds failed"; status=1; }
          exit "$status"

  powershell:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Install Neovim
        shell: pwsh
        run: |
          $wingetNvim = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links\nvim.exe'
          $programFilesNvim = Join-Path $env:ProgramFiles 'Neovim\bin\nvim.exe'
          $wingetPackage = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Packages') -Filter nvim.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not (Get-Command nvim -ErrorAction SilentlyContinue) -and -not (Test-Path -LiteralPath $wingetNvim) -and -not (Test-Path -LiteralPath $programFilesNvim) -and -not $wingetPackage) {
            winget install --id Neovim.Neovim --exact --silent --accept-package-agreements --accept-source-agreements
          }

      - name: Run PowerShell tests (Windows)
        shell: pwsh
        run: ./tests/powershell/runner.ps1

      - name: Test locked Pi extensions (Windows)
        shell: pwsh
        run: ./tests/powershell/integration_pi_extensions.ps1

      - name: Test raw Neovim config (Windows)
        shell: pwsh
        run: ./tests/powershell/integration_neovim.ps1

  bash-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Run ShellCheck
        run: nix develop . -c shellcheck -S warning -e SC1090,SC1091,SC2034,SC2088,SC2120 dotfile scripts/*.sh tests/bash/*.sh

      - name: Run bash tests
        run: |
          nix develop . -c bash -c '
            core_tests=()
            for test in ./tests/bash/test_*.sh; do
              [[ "$test" == */test_neovim.sh ]] || core_tests+=("${test##*/}")
            done

            bash ./tests/bash/runner.sh test_neovim.sh &
            neovim_pid=$!
            bash ./tests/bash/runner.sh "${core_tests[@]}" &
            core_pid=$!

            status=0
            wait "$neovim_pid" || { echo "::error::Linux Neovim tests failed"; status=1; }
            wait "$core_pid" || { echo "::error::Linux core tests failed"; status=1; }
            exit "$status"
          '

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Run flake check
        run: nix flake check --no-build --all-systems

      - name: Evaluate Home Manager configurations
        run: |
          username=$(nix eval --raw --file config/host.nix username)
          nix eval --raw ".#homeConfigurations.\"$username@linux\".activationPackage.drvPath"
          nix eval --raw ".#homeConfigurations.\"$username@arch-server\".activationPackage.drvPath"

      - name: Build custom packages
        run: nix build .#codex .#obsidian-headless .#pi-agent .#pi-extensions .#codebase-memory-mcp --no-link
