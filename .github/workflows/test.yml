name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Security-pinned Node overrides build from source on hosted runners.
  # Give Nix jobs a bounded cold-build budget; keep all tests enabled.
  changes:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.filter.outputs.linux }}
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" |
            bash scripts/ci_paths.sh >> "$GITHUB_OUTPUT"

  bash-macos:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.changes.result == 'success' && needs.changes.outputs.macos == 'true')) }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # Verify the proprietary bundle before installing Cachix's upload hook.
      # Do not redistribute Rex or its DMG through our public binary cache.
      - name: Verify Rex package
        run: nix build .#rex --no-link --print-build-logs

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          useDaemon: true

      - name: Run macOS checks in parallel
        shell: bash
        run: |
          (TIMEFORMAT="::notice::macOS portability including environment: %3R seconds"; time nix develop .#ci -c bash ./tests/bash/runner.sh test_cli.sh test_doctor.sh test_mac_install.sh test_tmux.sh test_release_pins.sh) &
          tests_pid=$!
          (TIMEFORMAT="::notice::nix-darwin evaluation: %3R seconds"; time nix eval --raw .#darwinConfigurations.mac.system.drvPath) &
          darwin_pid=$!
          (TIMEFORMAT="::notice::macOS package builds: %3R seconds"; time nix build .#pi-extensions --no-link --print-build-logs) &
          packages_pid=$!

          status=0
          wait "$tests_pid" || { echo "::error::macOS portability tests failed"; status=1; }
          wait "$darwin_pid" || { echo "::error::nix-darwin evaluation failed"; status=1; }
          wait "$packages_pid" || { echo "::error::macOS package builds failed"; status=1; }
          exit "$status"

  powershell:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.changes.result == 'success' && needs.changes.outputs.windows == 'true')) }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set npm download cache
        shell: pwsh
        run: |
          "NPM_CONFIG_CACHE=$(Join-Path $env:RUNNER_TEMP npm-cache)" >> $env:GITHUB_ENV

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: config/shared/ai/pi/extensions/package-lock.json

      - name: Install Neovim
        shell: pwsh
        run: |
          $wingetNvim = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links\nvim.exe'
          $programFilesNvim = Join-Path $env:ProgramFiles 'Neovim\bin\nvim.exe'
          $wingetPackage = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Packages') -Filter nvim.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not (Get-Command nvim -ErrorAction SilentlyContinue) -and -not (Test-Path -LiteralPath $wingetNvim) -and -not (Test-Path -LiteralPath $programFilesNvim) -and -not $wingetPackage) {
            winget install --id Neovim.Neovim --exact --silent --accept-package-agreements --accept-source-agreements
          }

      - name: Run Windows checks in parallel
        shell: pwsh
        env:
          NPM_CONFIG_TIMING: 'true'
        run: |
          $checks = @(
            [pscustomobject]@{ Name = 'PowerShell tests'; Path = './tests/powershell/runner.ps1' }
            [pscustomobject]@{ Name = 'Pi extension integration'; Path = './tests/powershell/integration_pi_extensions.ps1' }
            [pscustomobject]@{ Name = 'Neovim integration'; Path = './tests/powershell/integration_neovim.ps1' }
          )
          $jobs = foreach ($check in $checks) {
            Start-Job -Name $check.Name -WorkingDirectory $PWD -ArgumentList $check.Path, $check.Name -ScriptBlock {
              param($path, $name)
              $timer = [System.Diagnostics.Stopwatch]::StartNew()
              try {
                & $path
                if ($LASTEXITCODE -ne 0) { throw "$path exited with code $LASTEXITCODE" }
              } finally {
                $timer.Stop()
                Write-Host ("::notice::{0}: {1:F3} seconds" -f $name, $timer.Elapsed.TotalSeconds)
              }
            }
          }

          Wait-Job -Job $jobs | Out-Null
          $status = 0
          foreach ($job in $jobs) {
            Write-Host "--- $($job.Name) ---"
            Receive-Job -Job $job -ErrorAction Continue
            if ($job.State -ne 'Completed') {
              Write-Error "::error::$($job.Name) failed: $($job.ChildJobs[0].JobStateInfo.Reason.Message)" -ErrorAction Continue
              $status = 1
            }
          }
          Remove-Job -Job $jobs -Force
          exit $status

  bash-linux:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.changes.result == 'success' && needs.changes.outputs.linux == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Run Linux checks in parallel
        run: |
          # shellcheck disable=SC2016
          nix develop . -c bash -c '
            echo "::notice::Linux check environment ready"
            (TIMEFORMAT="::notice::ShellCheck: %3R seconds"; time shellcheck -S warning -e SC1090,SC1091,SC2034,SC2088,SC2120 dotfile scripts/*.sh tests/bash/*.sh) &
            shellcheck_pid=$!

            core_tests=()
            for test in ./tests/bash/test_*.sh; do
              case "$test" in
                */test_neovim.sh | */test_home_profiles.sh) ;;
                *) core_tests+=("${test##*/}") ;;
              esac
            done
            (TIMEFORMAT="::notice::Linux Neovim and profile tests: %3R seconds"; time DOTFILE_NEOVIM_TEST_CACHE=false bash ./tests/bash/runner.sh test_neovim.sh test_home_profiles.sh) &
            profiles_pid=$!
            (TIMEFORMAT="::notice::Linux core tests: %3R seconds"; time bash ./tests/bash/runner.sh "${core_tests[@]}") &
            core_pid=$!

            status=0
            wait "$shellcheck_pid" || { echo "::error::ShellCheck failed"; status=1; }
            wait "$profiles_pid" || { echo "::error::Linux Neovim or profile tests failed"; status=1; }
            wait "$core_pid" || { echo "::error::Linux core tests failed"; status=1; }
            exit "$status"
          '

  nix:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.changes.result == 'success' && needs.changes.outputs.nix == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Run flake check
        run: nix flake check --no-build --all-systems

      - name: Build custom packages
        run: nix build .#obsidian-headless .#pi-agent .#pi-extensions --no-link --print-build-logs
