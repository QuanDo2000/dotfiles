name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bash-macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run bash tests
        shell: bash
        run: nix develop . -c bash ./tests/bash/runner.sh

      - name: Evaluate nix-darwin configuration
        run: nix eval --raw .#darwinConfigurations.mac.system.drvPath

      - name: Build custom packages
        run: nix build .#codex .#codebase-memory-mcp .#fff-mcp .#fff-nvim-backend .#pi-extensions --no-link

  powershell:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Install Neovim
        shell: pwsh
        run: |
          $wingetNvim = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links\nvim.exe'
          $programFilesNvim = Join-Path $env:ProgramFiles 'Neovim\bin\nvim.exe'
          $wingetPackage = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Packages') -Filter nvim.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not (Get-Command nvim -ErrorAction SilentlyContinue) -and -not (Test-Path -LiteralPath $wingetNvim) -and -not (Test-Path -LiteralPath $programFilesNvim) -and -not $wingetPackage) {
            winget install --id Neovim.Neovim --exact --silent --accept-package-agreements --accept-source-agreements
          }

      - name: Run PowerShell tests (Windows)
        shell: pwsh
        run: ./tests/powershell/runner.ps1

      - name: Test locked Pi extensions (Windows)
        shell: pwsh
        run: ./tests/powershell/integration_pi_extensions.ps1

      - name: Test raw Neovim config (Windows)
        shell: pwsh
        run: ./tests/powershell/integration_neovim.ps1

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run ShellCheck
        run: nix develop . -c shellcheck -S warning -e SC1090,SC1091,SC2034,SC2088,SC2120 dotfile scripts/*.sh tests/bash/*.sh

      - name: Run bash tests
        run: nix develop . -c bash ./tests/bash/runner.sh

      - name: Run flake check
        run: nix flake check --no-build --all-systems

      - name: Evaluate Home Manager configurations
        run: |
          username=$(nix eval --raw --file config/host.nix username)
          nix eval --raw ".#homeConfigurations.\"$username@linux\".activationPackage.drvPath"
          nix eval --raw ".#homeConfigurations.\"$username@arch-server\".activationPackage.drvPath"

      - name: Build custom packages
        run: nix build .#codex .#obsidian-headless .#pi-agent .#pi-extensions .#fff-mcp .#fff-nvim-backend .#codebase-memory-mcp --no-link
